<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Rhythm</title>
    <style>
      :root {
        --bg-1: #0b1020;
        --bg-2: #16213e;
        --panel: rgba(255,255,255,0.06);
        --panel-border: rgba(255,255,255,0.12);
        --text: #f9fafb;
        --muted: #d1d5db;
        --accent: #6ee7b7;
        --accent-2: #60a5fa;
        --danger: #ff5d73;
        --warning: #ffd166;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .page {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .back {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 50;
        padding: 10px 16px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 800;
        color: #04130d;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }

      .lives {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 50;
      }

      .heart {
        width: 20px;
        height: 18px;
        background: linear-gradient(90deg, #ff677e, #ff9aa6);
        clip-path: polygon(50% 100%, 0% 40%, 8% 15%, 26% 8%, 50% 22%, 74% 8%, 92% 15%, 100% 40%);
      }

      .heart.empty {
        opacity: 0.18;
        filter: grayscale(100%);
      }

      .scoreDisplay {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 50;
        padding: 8px 12px;
        border-radius: 10px;
        font-weight: 800;
        color: var(--accent-2);
        background: rgba(255,255,255,0.04);
      }

      .playfield {
        position: absolute;
        inset: 0;
      }

      .lanes {
        position: absolute;
        inset: 0;
        display: flex;
      }

      .lane {
        position: relative;
        flex: 1;
        border-left: 1px solid rgba(255,255,255,0.03);
        border-right: 1px solid rgba(255,255,255,0.03);
        overflow: hidden;
      }

      .hit-row {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 78px;
        height: 12px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
      }

      .tile {
        position: absolute;
        left: 10%;
        width: 80%;
        height: 58px;
        border-radius: 12px;
        box-shadow: 0 12px 24px rgba(0,0,0,0.35);
        transform: translateY(0px);
        transition: opacity 0.07s ease;
      }

      .tile.p1 { background: linear-gradient(90deg, #ff8a65, #ffb86b); }
      .tile.p2 { background: linear-gradient(90deg, #9be7ff, #60a5fa); }
      .tile.p3 { background: linear-gradient(90deg, #c4b5fd, #8b5cf6); }
      .tile.p4 { background: linear-gradient(90deg, #86efac, #34d399); }

      .tile.hold {
        border-radius: 12px 12px 8px 8px;
      }

      .tile.hit {
        opacity: 0.15;
      }

      .tile.miss {
        opacity: 0.35;
        filter: grayscale(100%);
      }

      .center-ui {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }

      .btn {
        border: none;
        cursor: pointer;
        border-radius: 14px;
        padding: 16px 28px;
        font-weight: 800;
        font-size: 1rem;
        color: #04130d;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        box-shadow: 0 20px 40px rgba(96,165,250,0.2);
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(2, 6, 23, 0.52);
        z-index: 65;
      }

      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="page">
      <a class="back" href="index.html">Back</a>
      <div class="lives" id="lives"></div>
      <div class="scoreDisplay" id="scoreDisplay">Score: 0</div>

      <div class="playfield">
        <div class="lanes" id="lanes">
          <div class="lane" data-index="0"><div class="hit-row"></div></div>
          <div class="lane" data-index="1"><div class="hit-row"></div></div>
          <div class="lane" data-index="2"><div class="hit-row"></div></div>
          <div class="lane" data-index="3"><div class="hit-row"></div></div>
        </div>
      </div>

      <div class="center-ui" id="centerUi">
        <button class="btn" id="playBtn">Play</button>
      </div>

      <div class="overlay hidden" id="gameOver">
        <button class="btn" id="restartBtn">Restart</button>
      </div>
    </div>

    <audio id="song" crossorigin="anonymous" preload="none" style="display:none"></audio>

    <script>
      (function () {
        const song = document.getElementById('song');
        const lanes = document.getElementById('lanes');
        const playBtn = document.getElementById('playBtn');
        const restartBtn = document.getElementById('restartBtn');
        const centerUi = document.getElementById('centerUi');
        const gameOver = document.getElementById('gameOver');
        const livesEl = document.getElementById('lives');
        const scoreEl = document.getElementById('scoreDisplay');

        const songUrl = 'https://raw.githubusercontent.com/xevdvv/xevdvv.github.io/main/Mariah%20Deborah%20-%20Na%20Para%20Bang%20%28Official%20Lyric%20Visualizer%29.mp3';

        const HIT_WINDOW = 0.22;
        const MISS_WINDOW = 0.34;
        const BASE_TRAVEL = 2.2;
        const MAX_SPEED = 8;

        let audioCtx = null;
        let running = false;
        let beatmap = [];
        let activeNotes = [];
        let nextIndex = 0;
        let rafId = null;
        let score = 0;
        let lives = 3;
        let speedMultiplier = 1;
        let noteTravelTime = BASE_TRAVEL;
        let lastNoteId = 0;
        let holdState = { 0: false, 1: false, 2: false, 3: false };

        function clamp(value, min, max) {
          return Math.min(Math.max(value, min), max);
        }

        function playTone(freq, duration = 0.05) {
          if (!audioCtx) return;
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = freq;
          gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.01);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.start();
          oscillator.stop(audioCtx.currentTime + duration + 0.02);
        }

        function renderLives() {
          livesEl.innerHTML = '';
          for (let i = 0; i < 3; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart' + (i < lives ? '' : ' empty');
            livesEl.appendChild(heart);
          }
        }

        function renderScore() {
          scoreEl.textContent = 'Score: ' + score + (speedMultiplier > 1 ? '  x' + speedMultiplier : '');
        }

        function setSong() {
          song.src = songUrl;
          song.crossOrigin = 'anonymous';
          song.preload = 'none';
          song.pause();
        }

        function buildBeatmap() {
          const grid = [];
          const bpm = 118;
          const gap = 60 / bpm;
          for (let i = 0; i < 120; i++) {
            const time = 0.35 + i * gap;
            const lane = i % 4;
            const isHold = i % 7 === 3;
            const hold = isHold ? 0.55 + (i % 3) * 0.2 : 0;
            grid.push({ id: ++lastNoteId, time, lane, hold });
          }
          return grid;
        }

        function ensureAudio() {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
        }

        function clearTiles() {
          activeNotes.forEach((item) => item.el.remove());
          activeNotes = [];
        }

        function spawnNotes() {
          const now = song.currentTime;
          while (nextIndex < beatmap.length && beatmap[nextIndex].time <= now + noteTravelTime + 0.12) {
            const note = beatmap[nextIndex];
            const laneEl = lanes.querySelector('.lane[data-index="' + note.lane + '"]');
            if (!laneEl) break;

            const el = document.createElement('div');
            el.className = 'tile p' + (note.lane + 1) + (note.hold > 0 ? ' hold' : '');
            laneEl.appendChild(el);

            activeNotes.push({
              id: note.id,
              lane: note.lane,
              time: note.time,
              hold: note.hold,
              el,
              hit: false,
              started: false,
              holding: false,
              holdStart: 0
            });

            nextIndex += 1;
          }
        }

        function removeNote(noteItem) {
          if (noteItem && noteItem.el && noteItem.el.parentNode) {
            noteItem.el.remove();
          }
          activeNotes = activeNotes.filter((item) => item.id !== noteItem.id);
        }

        function updateTiles() {
          const now = song.currentTime;
          const laneHeight = lanes.getBoundingClientRect().height || 600;
          const spawnY = -90;
          const hitY = laneHeight - 86;

          for (let i = activeNotes.length - 1; i >= 0; i--) {
            const item = activeNotes[i];
            if (!item || !item.el) continue;

            const progress = (now - (item.time - noteTravelTime)) / noteTravelTime;
            const y = spawnY + (hitY - spawnY) * clamp(progress, 0, 1);
            item.el.style.transform = 'translateY(' + y + 'px)';

            if (item.hold > 0 && item.holding && now > item.time + item.hold + 0.18) {
              if (!item.hit) {
                item.hit = true;
                item.el.classList.add('hit');
                removeNote(item);
                awardPoints(250);
                playTone(1500, 0.04);
              }
            }

            if (progress > 1.25 && !item.hit) {
              item.el.classList.add('miss');
              removeNote(item);
              loseLife();
            }
          }
        }

        function awardPoints(amount) {
          score += amount;
          renderScore();
        }

        function loseLife() {
          lives = Math.max(0, lives - 1);
          renderLives();

          if (lives <= 0) {
            running = false;
            song.pause();
            cancelAnimationFrame(rafId);
            gameOver.classList.remove('hidden');
            centerUi.classList.add('hidden');
          }
        }

        function cycleSpeed() {
          speedMultiplier = Math.min(MAX_SPEED, speedMultiplier * 2);
          noteTravelTime = BASE_TRAVEL / speedMultiplier;
          renderScore();
        }

        function handleLaneHit(laneIndex) {
          let bestItem = null;
          let bestGap = Number.POSITIVE_INFINITY;

          for (const item of activeNotes) {
            if (item.lane !== laneIndex) continue;
            const gap = Math.abs(song.currentTime - item.time);
            if (gap < bestGap) {
              bestGap = gap;
              bestItem = item;
            }
          }

          if (!bestItem) return;

          if (bestGap <= HIT_WINDOW) {
            if (bestItem.hold > 0) {
              if (!bestItem.holding) {
                bestItem.holding = true;
                bestItem.holdStart = song.currentTime;
                bestItem.el.classList.add('hit');
                return;
              }
            } else {
              bestItem.hit = true;
              bestItem.el.classList.add('hit');
              removeNote(bestItem);
              awardPoints(100);
              playTone(1400, 0.03);
            }
          }
        }

        function handleHoldRelease(laneIndex) {
          for (const item of activeNotes) {
            if (item.lane !== laneIndex || item.hold <= 0 || !item.holding) continue;
            const heldEnough = song.currentTime >= item.time + item.hold - 0.08;
            if (heldEnough) {
              item.hit = true;
              item.el.classList.add('hit');
              removeNote(item);
              awardPoints(250);
              playTone(1500, 0.04);
            } else {
              item.el.classList.add('miss');
              removeNote(item);
              loseLife();
              playTone(220, 0.06);
            }
            item.holding = false;
            return;
          }
        }

        function updateLoop() {
          if (!running) return;
          spawnNotes();
          updateTiles();
          rafId = requestAnimationFrame(updateLoop);
        }

        async function countdown() {
          const btn = centerUi.querySelector('.btn');
          btn.disabled = true;
          const seq = ['3', '2', '1', 'GO!'];
          for (let i = 0; i < seq.length; i++) {
            btn.textContent = seq[i];
            await new Promise((resolve) => setTimeout(resolve, 700));
          }
          btn.textContent = 'Play';
          btn.disabled = false;
        }

        async function prepareAndStartRun(resetScore = true) {
          if (running) return;

          ensureAudio();
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }

          if (resetScore) {
            score = 0;
            lives = 3;
            speedMultiplier = 1;
            noteTravelTime = BASE_TRAVEL;
            renderLives();
            renderScore();
          }

          beatmap = buildBeatmap();
          nextIndex = 0;
          clearTiles();
          gameOver.classList.add('hidden');
          centerUi.classList.remove('hidden');
          centerUi.querySelector('.btn').textContent = 'Starting...';

          await countdown();
          centerUi.classList.add('hidden');

          running = true;
          song.currentTime = 0;
          song.play().catch(() => {});
          updateLoop();
        }

        function nextRound() {
          if (!running) return;
          running = false;
          cancelAnimationFrame(rafId);
          clearTiles();

          if (lives > 0) {
            cycleSpeed();
            centerUi.classList.remove('hidden');
            const button = centerUi.querySelector('.btn');
            button.textContent = 'Speed x' + speedMultiplier;
            button.disabled = true;

            setTimeout(async () => {
              await countdown();
              centerUi.classList.add('hidden');
              beatmap = buildBeatmap();
              nextIndex = 0;
              clearTiles();
              running = true;
              song.currentTime = 0;
              song.play().catch(() => {});
              updateLoop();
            }, 300);
          } else {
            gameOver.classList.remove('hidden');
          }
        }

        song.addEventListener('ended', () => {
          if (running) {
            nextRound();
          }
        });

        playBtn.addEventListener('click', () => {
          prepareAndStartRun(true);
        });

        restartBtn.addEventListener('click', () => {
          gameOver.classList.add('hidden');
          centerUi.classList.remove('hidden');
          const button = centerUi.querySelector('.btn');
          button.textContent = 'Play';
          button.disabled = false;
          prepareAndStartRun(true);
        });

        document.addEventListener('pointerdown', (event) => {
          const lane = event.target.closest('.lane');
          if (!lane || !running) return;
          const laneIndex = Number(lane.dataset.index);
          const isPointerDown = true;
          holdState[laneIndex] = isPointerDown;
          handleLaneHit(laneIndex);
        });

        document.addEventListener('pointerup', () => {
          for (let laneIndex = 0; laneIndex < 4; laneIndex += 1) {
            if (holdState[laneIndex]) {
              handleHoldRelease(laneIndex);
            }
            holdState[laneIndex] = false;
          }
        });

        const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3 };
        window.addEventListener('keydown', (event) => {
          if (event.key in keyMap) {
            const laneIndex = keyMap[event.key];
            if (!event.repeat) {
              holdState[laneIndex] = true;
              handleLaneHit(laneIndex);
            }
          }
        });

        window.addEventListener('keyup', (event) => {
          if (event.key in keyMap) {
            const laneIndex = keyMap[event.key];
            handleHoldRelease(laneIndex);
            holdState[laneIndex] = false;
          }
        });

        setSong();
        renderLives();
        renderScore();
      })();
    </script>
  </body>
</html>
