<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Rhythm</title>
    <style>
      :root {
        --bg-1: #0b1020;
        --bg-2: #16213e;
        --panel: rgba(255,255,255,0.06);
        --panel-border: rgba(255,255,255,0.12);
        --text: #f9fafb;
        --muted: #d1d5db;
        --accent: #6ee7b7;
        --accent-2: #60a5fa;
        --danger: #ff5d73;
        --warning: #ffd166;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .page {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .back {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 50;
        padding: 10px 16px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 800;
        color: #04130d;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .end-btn {
        position: absolute;
        top: 66px; /* below back button */
        left: 14px;
        z-index: 50;
        padding: 8px 12px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 800;
        color: #04130d;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .scoreDisplay {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 50;
        padding: 8px 12px;
        border-radius: 10px;
        font-weight: 800;
        color: var(--accent-2);
        background: rgba(255,255,255,0.04);
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .playfield {
        position: absolute;
        inset: 0;
      }

      .lanes {
        position: absolute;
        inset: 0;
        display: flex;
      }

      .lane {
        position: relative;
        flex: 1;
        border-left: 1px solid rgba(255,255,255,0.03);
        border-right: 1px solid rgba(255,255,255,0.03);
        overflow: hidden;
        touch-action: none; /* help mobile pointer handling */
      }

      .hit-row {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 100px; /* moved down to match taller tiles */
        height: 16px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
      }

      .tile {
        position: absolute;
        left: 10%;
        width: 80%;
        height: 110px; /* increased vertical length */
        border-radius: 12px;
        /* reduced shadows for mobile performance */
        box-shadow: 0 6px 12px rgba(0,0,0,0.25);
        transform: translate3d(0, 0, 0);
        will-change: transform, opacity;
        transition: opacity 0.07s ease;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }

      .tile.p1 { background: linear-gradient(90deg, #ff8a65, #ffb86b); }
      .tile.p2 { background: linear-gradient(90deg, #9be7ff, #60a5fa); }
      .tile.p3 { background: linear-gradient(90deg, #c4b5fd, #8b5cf6); }
      .tile.p4 { background: linear-gradient(90deg, #86efac, #34d399); }

      .tile.hold {
        border-radius: 12px 12px 8px 8px;
      }

      .tile.hit {
        opacity: 0.15;
      }

      .tile.miss {
        opacity: 0.35;
        filter: grayscale(100%);
      }

      .center-ui {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 60;
      }

      .btn {
        border: none;
        cursor: pointer;
        border-radius: 14px;
        padding: 16px 28px;
        font-weight: 800;
        font-size: 1rem;
        color: #04130d;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        box-shadow: 0 20px 40px rgba(96,165,250,0.2);
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: opacity 280ms ease, transform 120ms ease;
      }

      /* visual active feedback */
      .btn:active { transform: scale(0.98); }

      /* faded state for idle buttons */
      .btn.faded, .end-btn.faded, .back.faded, .scoreDisplay.faded {
        opacity: 0.45;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(2, 6, 23, 0.72);
        z-index: 200;
      }

      .summary {
        background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
        padding: 20px 24px;
        border-radius: 12px;
        text-align: center;
        min-width: 220px;
      }

      .summary h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
      .summary p { margin: 6px 0; color: var(--muted); }
      .summary .big { font-weight: 900; color: var(--accent-2); font-size: 1.4rem; }

      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="page">
      <a class="back" href="index.html">Back</a>
      <button class="end-btn" id="endBtn">End Level</button>
      <div class="scoreDisplay" id="scoreDisplay">Score: 0</div>

      <div class="playfield">
        <div class="lanes" id="lanes">
          <div class="lane" data-index="0"><div class="hit-row"></div></div>
          <div class="lane" data-index="1"><div class="hit-row"></div></div>
          <div class="lane" data-index="2"><div class="hit-row"></div></div>
          <div class="lane" data-index="3"><div class="hit-row"></div></div>
        </div>
      </div>

      <div class="center-ui" id="centerUi">
        <button class="btn" id="playBtn">Play</button>
      </div>

      <div class="overlay hidden" id="summaryOverlay">
        <div class="summary" id="summaryContent">
          <h3>Level Summary</h3>
          <p>Score</p>
          <div class="big" id="summaryScore">0</div>
          <p>Time Played</p>
          <div class="big" id="summaryTime">00:00</div>
          <p>Best Score</p>
          <div class="big" id="summaryBest">0</div>
          <div style="margin-top:12px">
            <button class="btn" id="summaryRestartBtn">Restart</button>
          </div>
        </div>
      </div>

    </div>

    <audio id="song" crossorigin="anonymous" preload="auto" style="display:none"></audio>

    <script>
      (function () {
        const song = document.getElementById('song');
        const lanes = document.getElementById('lanes');
        const playBtn = document.getElementById('playBtn');
        const restartBtn = document.getElementById('restartBtn');
        const centerUi = document.getElementById('centerUi');
        const summaryOverlay = document.getElementById('summaryOverlay');
        const summaryScore = document.getElementById('summaryScore');
        const summaryTime = document.getElementById('summaryTime');
        const summaryBest = document.getElementById('summaryBest');
        const summaryRestartBtn = document.getElementById('summaryRestartBtn');
        const endBtn = document.getElementById('endBtn');
        const scoreEl = document.getElementById('scoreDisplay');
        const backLink = document.querySelector('.back');

        const songUrl = 'https://raw.githubusercontent.com/xevdvv/xevdvv.github.io/main/Mariah%20Deborah%20-%20Na%20Para%20Bang%20%28Official%20Lyric%20Visualizer%29.mp3';

        const HIT_WINDOW = 0.22;
        const MISS_WINDOW = 0.34;
        const BASE_TRAVEL = 2.6; // base travel time (seconds) - lower = faster
        const MAX_SPEED = 8;
        const HOLD_START_PROGRESS = 0.55;

        let audioCtx = null;
        let running = false;
        let beatmap = [];
        let activeNotes = [];
        let nextIndex = 0;
        let rafId = null;
        let score = 0;
        let bestScore = Number(localStorage.getItem('bestScore') || 0);
        let speedMultiplier = 1;
        let noteTravelTime = BASE_TRAVEL;
        let lastNoteId = 0;
        let holdState = { 0: false, 1: false, 2: false, 3: false };

        // time played tracking
        let runStartTime = 0; // seconds (performance.now()/1000)
        let accumulatedPlayTime = 0; // seconds

        // fade/idle handling
        const IDLE_FADE_MS = 2000; // fade after 2s of no interaction
        let fadeTimer = null;
        const interactiveButtons = [playBtn, endBtn, scoreEl, backLink, summaryRestartBtn].filter(Boolean);

        function clamp(value, min, max) {
          return Math.min(Math.max(value, min), max);
        }

        function formatTimeSec(sec) {
          sec = Math.max(0, Math.floor(sec));
          const m = Math.floor(sec / 60).toString().padStart(2, '0');
          const s = (sec % 60).toString().padStart(2, '0');
          return m + ':' + s;
        }

        function playTone(freq, duration = 0.05) {
          if (!audioCtx) return;
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = freq;
          gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.01);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.start();
          oscillator.stop(audioCtx.currentTime + duration + 0.02);
        }

        function renderScore() {
          scoreEl.textContent = 'Score: ' + score + (speedMultiplier > 1 ? '  x' + speedMultiplier.toFixed(2) : '');
        }

        function setSong() {
          song.src = songUrl;
          song.crossOrigin = 'anonymous';
          song.preload = 'auto';
          try { song.load(); } catch (e) {}
          song.pause();
        }

        function buildBeatmap() {
          const grid = [];
          const bpm = 118;
          const gap = 60 / bpm;
          for (let i = 0; i < 120; i++) {
            const time = 0.35 + i * gap;
            const lane = i % 4;
            const isHold = i % 7 === 3;
            const hold = isHold ? 0.55 + (i % 3) * 0.2 : 0;
            grid.push({ id: ++lastNoteId, time, lane, hold });
          }
          return grid;
        }

        function ensureAudio() {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
        }

        function clearTiles() {
          activeNotes.forEach((item) => {
            if (item.el && item.el.parentNode) item.el.remove();
          });
          activeNotes = [];
        }

        function spawnNotes() {
          const now = song.currentTime || 0;
          while (nextIndex < beatmap.length && beatmap[nextIndex].time <= now + noteTravelTime + 0.12) {
            const note = beatmap[nextIndex];
            const laneEl = lanes.querySelector('.lane[data-index="' + note.lane + '"]');
            if (!laneEl) break;

            const el = document.createElement('div');
            el.className = 'tile p' + (note.lane + 1) + (note.hold > 0 ? ' hold' : '');
            laneEl.appendChild(el);

            activeNotes.push({
              id: note.id,
              lane: note.lane,
              time: note.time,
              hold: note.hold,
              el,
              hit: false,
              started: false,
              holding: false,
              holdStart: 0
            });

            nextIndex += 1;
          }
        }

        function removeNote(noteItem) {
          if (!noteItem) return;
          try {
            if (noteItem.el && noteItem.el.parentNode) noteItem.el.remove();
          } catch (e) {}
          activeNotes = activeNotes.filter((item) => item.id !== noteItem.id);
        }

        function updateTiles() {
          const now = song.currentTime || 0;
          const laneHeight = lanes.getBoundingClientRect().height || 600;
          const spawnY = -160; // higher spawn to match taller tiles
          const hitY = laneHeight - 140;

          for (let i = activeNotes.length - 1; i >= 0; i--) {
            const item = activeNotes[i];
            if (!item || !item.el) continue;

            const progress = (now - (item.time - noteTravelTime)) / noteTravelTime;
            const y = spawnY + (hitY - spawnY) * clamp(progress, 0, 1);
            item.el.style.transform = 'translate3d(0,' + Math.round(y) + 'px,0)';

            if (item.hold > 0 && item.holding && now > item.time + item.hold + 0.18) {
              if (!item.hit) {
                item.hit = true;
                item.el.classList.add('hit');
                removeNote(item);
                awardPoints(250);
                playTone(1500, 0.04);
              }
            }

            if (progress > 1.25 && !item.hit) {
              item.el.classList.add('miss');
              removeNote(item);
              // endless mode: just play miss sound, no life penalty
              playTone(220, 0.06);
            }
          }
        }

        function awardPoints(amount) {
          score += amount;
          // update best score if exceeded
          if (score > bestScore) {
            bestScore = score;
            try { localStorage.setItem('bestScore', String(bestScore)); } catch (e) {}
          }
          renderScore();
        }

        function increaseSpeedForNextLoop() {
          speedMultiplier = Math.min(MAX_SPEED, speedMultiplier + 0.25);
          noteTravelTime = BASE_TRAVEL / speedMultiplier;
        }

        function handleLaneHit(laneIndex) {
          const now = song.currentTime || 0;
          let bestItem = null;
          let bestGap = Number.POSITIVE_INFINITY;

          for (const item of activeNotes) {
            if (item.lane !== laneIndex || item.hit) continue;
            const gap = Math.abs(now - item.time);
            if (gap < bestGap) {
              bestGap = gap;
              bestItem = item;
            }
          }

          if (!bestItem) return;

          if (bestItem.hold > 0) {
            const progress = (now - (bestItem.time - noteTravelTime)) / noteTravelTime;
            if (progress >= HOLD_START_PROGRESS || bestGap <= HIT_WINDOW) {
              if (!bestItem.holding) {
                bestItem.holding = true;
                bestItem.holdStart = now;
                bestItem.el.classList.add('hit');
                return;
              }
            }
            return;
          }

          if (bestGap <= HIT_WINDOW) {
            bestItem.hit = true;
            bestItem.el.classList.add('hit');
            removeNote(bestItem);
            awardPoints(100);
            playTone(1400, 0.03);
          }
        }

        function handleHoldRelease(laneIndex) {
          for (const item of activeNotes) {
            if (item.lane !== laneIndex || item.hold <= 0 || !item.holding) continue;
            const now = song.currentTime || 0;
            const heldEnough = now >= item.time + item.hold - 0.08;
            if (heldEnough) {
              item.hit = true;
              item.el.classList.add('hit');
              removeNote(item);
              awardPoints(250);
              playTone(1500, 0.04);
            } else {
              item.el.classList.add('miss');
              removeNote(item);
              playTone(220, 0.06);
            }
            item.holding = false;
            return;
          }
        }

        function updateLoop() {
          if (!running) return;
          spawnNotes();
          updateTiles();
          rafId = requestAnimationFrame(updateLoop);
        }

        async function countdown() {
          const btn = centerUi.querySelector('.btn');
          btn.disabled = true;
          const seq = ['3', '2', '1', 'GO!'];
          for (let i = 0; i < seq.length; i++) {
            btn.textContent = seq[i];
            await new Promise((resolve) => setTimeout(resolve, 700));
          }
          btn.textContent = 'Play';
          btn.disabled = false;
        }

        async function prepareAndStartRun(resetScore = true) {
          if (running) return;

          ensureAudio();
          if (audioCtx.state === 'suspended') {
            try { await audioCtx.resume(); } catch (e) {}
          }

          if (resetScore) {
            score = 0;
            speedMultiplier = 1;
            noteTravelTime = BASE_TRAVEL;
            accumulatedPlayTime = 0;
            runStartTime = performance.now() / 1000;
            renderScore();
          } else {
            // starting/continuing without resetting score: resume timer
            runStartTime = performance.now() / 1000;
          }

          beatmap = buildBeatmap();
          nextIndex = 0;
          clearTiles();
          centerUi.classList.add('hidden');

          await countdown();

          running = true;
          song.currentTime = 0;
          song.play().catch(() => {});
          updateLoop();
        }

        function endLevel() {
          if (!running) {
            // if already stopped, just show summary
            showSummary();
            return;
          }
          // stop the run and accumulate time
          running = false;
          try { cancelAnimationFrame(rafId); } catch (e) {}
          try { song.pause(); } catch (e) {}
          const now = performance.now() / 1000;
          accumulatedPlayTime += Math.max(0, now - runStartTime);
          showSummary();
        }

        function showSummary() {
          // compute total time
          let timeSec = accumulatedPlayTime;
          if (running) {
            const now = performance.now() / 1000;
            timeSec += Math.max(0, now - runStartTime);
          }

          summaryScore.textContent = String(score);
          summaryTime.textContent = formatTimeSec(timeSec);
          summaryBest.textContent = String(bestScore || 0);

          summaryOverlay.classList.remove('hidden');
        }

        function hideSummary() {
          summaryOverlay.classList.add('hidden');
        }

        // Endless behavior: when song ends, increase speed and continue immediately
        song.addEventListener('ended', () => {
          if (!running) return;
          increaseSpeedForNextLoop();
          beatmap = buildBeatmap();
          nextIndex = 0;
          clearTiles();
          try { song.currentTime = 0; song.play().catch(() => {}); } catch (e) {}
        });

        // improve tap responsiveness: listen to pointerdown as well as click
        function startBtnHandler(e) {
          // stop event propagation so pointer events on lanes don't misfire
          e && e.stopPropagation && e.stopPropagation();
          prepareAndStartRun(true);
        }

        playBtn.addEventListener('click', startBtnHandler);
        playBtn.addEventListener('pointerdown', startBtnHandler, { passive: true });
        playBtn.addEventListener('touchstart', startBtnHandler, { passive: true });

        // restart from overlay
        summaryRestartBtn.addEventListener('click', async () => {
          hideSummary();
          // reset values and start fresh
          accumulatedPlayTime = 0;
          runStartTime = performance.now() / 1000;
          await prepareAndStartRun(true);
        });

        endBtn.addEventListener('click', () => {
          endLevel();
        });

        // show summary when tapping score
        scoreEl.addEventListener('click', () => {
          // pause run while viewing
          if (running) {
            const now = performance.now() / 1000;
            accumulatedPlayTime += Math.max(0, now - runStartTime);
            running = false;
            try { cancelAnimationFrame(rafId); } catch (e) {}
            try { song.pause(); } catch (e) {}
          }
          showSummary();
        });

        // close overlay when tapping background
        summaryOverlay.addEventListener('click', (e) => {
          if (e.target === summaryOverlay) {
            hideSummary();
          }
        });

        // some pages referenced restartBtn previously; keep safe no-op if missing
        restartBtn && restartBtn.addEventListener('click', () => {
          // restart main UI button behaviour
          accumulatedPlayTime = 0;
          runStartTime = performance.now() / 1000;
          prepareAndStartRun(true);
          hideSummary();
        });

        document.addEventListener('pointerdown', (event) => {
          const lane = event.target.closest('.lane');
          if (!lane || !running) return;
          const laneIndex = Number(lane.dataset.index);
          holdState[laneIndex] = true;
          handleLaneHit(laneIndex);
        }, { passive: true });

        document.addEventListener('pointerup', (event) => {
          const lane = event.target.closest('.lane');
          if (lane) {
            try { lane.releasePointerCapture && lane.releasePointerCapture(event.pointerId); } catch (e) {}
          }

          for (let laneIndex = 0; laneIndex < 4; laneIndex += 1) {
            if (holdState[laneIndex]) {
              handleHoldRelease(laneIndex);
            }
            holdState[laneIndex] = false;
          }
        }, { passive: true });

        const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3 };
        window.addEventListener('keydown', (event) => {
          if (event.key in keyMap) {
            const laneIndex = keyMap[event.key];
            if (!event.repeat) {
              holdState[laneIndex] = true;
              handleLaneHit(laneIndex);
            }
          }
        });

        window.addEventListener('keyup', (event) => {
          if (event.key in keyMap) {
            const laneIndex = keyMap[event.key];
            handleHoldRelease(laneIndex);
            holdState[laneIndex] = false;
          }
        });

        // fade helper functions
        function setButtonsFaded(faded) {
          interactiveButtons.forEach((el) => {
            if (!el) return;
            if (faded) el.classList.add('faded'); else el.classList.remove('faded');
          });
        }

        function resetFadeTimer() {
          // clear existing
          if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
          // remove faded immediately on interaction
          setButtonsFaded(false);
          // re-schedule fade
          fadeTimer = setTimeout(() => {
            // don't fade while summary overlay is open
            if (summaryOverlay && !summaryOverlay.classList.contains('hidden')) return;
            setButtonsFaded(true);
          }, IDLE_FADE_MS);
        }

        // listen for user interactions to control fade behavior
        ['pointermove', 'pointerdown', 'touchstart', 'keydown', 'mousemove', 'mousedown'].forEach((evt) => {
          window.addEventListener(evt, resetFadeTimer, { passive: true });
        });

        // initialize fade timer
        resetFadeTimer();

        setSong();
        renderScore();
      })();
    </script>
  </body>
</html>
