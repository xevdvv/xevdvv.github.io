<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Rhythm</title>
    <style>
      :root {
        --bg-1: #0b1020;
        --bg-2: #16213e;
        --panel: rgba(255, 255, 255, 0.04);
        --panel-border: rgba(255, 255, 255, 0.08);
        --accent: #6ee7b7;
        --accent-2: #60a5fa;
        --hit: #ffd166;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Inter, system-ui, Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: #fff;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .page {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .back {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 30;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: #04130d;
        font-weight: 800;
        padding: 10px 16px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(96, 165, 250, 0.22);
      }

      .lives {
        position: absolute;
        left: 50%;
        top: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 25;
      }

      .heart {
        width: 20px;
        height: 18px;
        background: linear-gradient(90deg, #ff677e, #ff9aa6);
        clip-path: polygon(
          50% 100%,
          0% 40%,
          8% 15%,
          26% 8%,
          50% 22%,
          74% 8%,
          92% 15%,
          100% 40%
        );
        opacity: 1;
      }

      .heart.empty {
        opacity: 0.2;
        filter: grayscale(100%);
      }

      .playfield {
        position: absolute;
        inset: 0;
        display: flex;
      }

      .lanes {
        width: 100%;
        height: 100%;
        display: flex;
      }

      .lane {
        flex: 1;
        position: relative;
        overflow: hidden;
        border-left: 1px solid rgba(255, 255, 255, 0.03);
        border-right: 1px solid rgba(255, 255, 255, 0.03);
      }

      .lane .hit-row {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 78px;
        height: 10px;
        background: linear-gradient(90deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        border-radius: 999px;
      }

      .note {
        position: absolute;
        left: 10%;
        width: 80%;
        height: 58px;
        border-radius: 10px;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
        will-change: transform, opacity;
      }

      .note.p1 { background: linear-gradient(90deg, #ff8a65, #ffb86b); }
      .note.p2 { background: linear-gradient(90deg, #9be7ff, #60a5fa); }
      .note.p3 { background: linear-gradient(90deg, #c4b5fd, #8b5cf6); }
      .note.p4 { background: linear-gradient(90deg, #86efac, #34d399); }

      .note.hit {
        opacity: 0.9;
        transform: scale(0.94);
      }

      .note.miss {
        opacity: 0.55;
        filter: grayscale(100%);
      }

      .center-ui {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn {
        border: none;
        cursor: pointer;
        border-radius: 14px;
        padding: 16px 28px;
        font-weight: 800;
        font-size: 1rem;
        color: #04130d;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        box-shadow: 0 20px 40px rgba(96, 165, 250, 0.2);
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(2, 6, 23, 0.5);
        z-index: 40;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 920px) {
        .note { height: 54px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <a class="back" href="index.html">Back</a>

      <div class="lives" id="lives"></div>

      <div class="playfield">
        <div class="lanes" id="lanes">
          <div class="lane" data-index="0"><div class="hit-row"></div></div>
          <div class="lane" data-index="1"><div class="hit-row"></div></div>
          <div class="lane" data-index="2"><div class="hit-row"></div></div>
          <div class="lane" data-index="3"><div class="hit-row"></div></div>
        </div>
      </div>

      <div class="center-ui" id="centerUi">
        <button class="btn" id="playBtn">Play</button>
      </div>

      <div class="overlay hidden" id="gameOver">
        <button class="btn" id="restartBtn">Restart</button>
      </div>
    </div>

    <audio id="song" crossorigin="anonymous" preload="none" style="display:none"></audio>

    <script>
      (function () {
        const LANES = 4;
        const song = document.getElementById('song');
        const lanes = document.getElementById('lanes');
        const playBtn = document.getElementById('playBtn');
        const restartBtn = document.getElementById('restartBtn');
        const centerUi = document.getElementById('centerUi');
        const gameOver = document.getElementById('gameOver');
        const livesEl = document.getElementById('lives');

        const songUrl =
          'https://raw.githubusercontent.com/xevdvv/xevdvv.github.io/main/Mariah%20Deborah%20-%20Na%20Para%20Bang%20%28Official%20Lyric%20Visualizer%29.mp3';

        const noteTravelTime = 1.55;
        const spawnTop = -140;

        let audioCtx = null;
        let sourceNode = null;
        let analyser = null;
        let running = false;
        let beatmap = [];
        let activeNotes = [];
        let nextIndex = 0;
        let rafId = null;
        let lives = 3;

        function initAudio() {
          if (audioCtx) return;
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          sourceNode = audioCtx.createMediaElementSource(song);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
        }

        function renderLives() {
          livesEl.innerHTML = '';
          for (let i = 0; i < 3; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart' + (i < lives ? '' : ' empty');
            livesEl.appendChild(heart);
          }
        }

        function setSong() {
          song.src = songUrl;
          song.crossOrigin = 'anonymous';
          song.preload = 'none';
          song.autoplay = false;
          song.pause();
        }

        function buildBeatmap() {
          const bpm = 120;
          const beatSec = 60 / bpm;
          const beats = [];
          for (let i = 0; i < 64; i++) {
            beats.push({ t: i * beatSec + 0.25, lane: i % LANES });
          }
          return beats;
        }

        function clearNotes() {
          activeNotes.forEach((n) => n.el.remove());
          activeNotes = [];
        }

        function spawnNotes() {
          const now = song.currentTime;
          while (nextIndex < beatmap.length) {
            const note = beatmap[nextIndex];
            if (note.t <= now + 1.1) {
              const laneEl = lanes.querySelector('.lane[data-index="' + note.lane + '"]');
              const el = document.createElement('div');
              el.className = 'note p' + (note.lane + 1);
              laneEl.appendChild(el);
              activeNotes.push({ id: 'n' + nextIndex, el, lane: note.lane, time: note.t });
              nextIndex++;
            } else {
              break;
            }
          }
        }

        function updateNotes() {
          const now = song.currentTime;
          for (let i = activeNotes.length - 1; i >= 0; i--) {
            const note = activeNotes[i];
            const laneEl = lanes.querySelector('.lane[data-index="' + note.lane + '"]');
            const laneHeight = laneEl.getBoundingClientRect().height;
            const laneHitY = laneHeight - 78;
            const progress = (now - (note.time - noteTravelTime)) / noteTravelTime;
            const y = progress * (laneHitY - spawnTop) + spawnTop;
            note.el.style.transform = 'translateY(' + y + 'px)';

            if (progress > 1.3) {
              note.el.classList.add('miss');
              note.el.remove();
              activeNotes.splice(i, 1);
              loseLife();
            }
          }
        }

        function loseLife() {
          lives = Math.max(0, lives - 1);
          renderLives();

          if (lives <= 0) {
            running = false;
            song.pause();
            cancelAnimationFrame(rafId);
            gameOver.classList.remove('hidden');
            centerUi.classList.add('hidden');
          }
        }

        function playTone(freq, duration) {
          if (!audioCtx) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration + 0.02);
        }

        function hitLane(lane) {
          if (!running) return;

          let bestIdx = -1;
          let bestDiff = 999;

          for (let i = 0; i < activeNotes.length; i++) {
            const note = activeNotes[i];
            if (note.lane !== lane) continue;
            const diff = Math.abs(song.currentTime - note.time);
            if (diff < bestDiff) {
              bestDiff = diff;
              bestIdx = i;
            }
          }

          if (bestIdx !== -1 && bestDiff <= 0.22) {
            const match = activeNotes[bestIdx];
            match.el.classList.add('hit');
            match.el.remove();
            activeNotes.splice(bestIdx, 1);
            playTone(1400, 0.04);
          } else {
            loseLife();
            playTone(220, 0.06);
          }
        }

        function startGame() {
          if (running) return;
          initAudio();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          clearNotes();
          beatmap = buildBeatmap();
          nextIndex = 0;
          lives = 3;
          renderLives();

          centerUi.classList.add('hidden');
          gameOver.classList.add('hidden');

          running = true;
          song.currentTime = 0;
          song.play().catch(()=>{});

          function loop() {
            if (!running) return;
            spawnNotes();
            updateNotes();
            rafId = requestAnimationFrame(loop);
          }

          rafId = requestAnimationFrame(loop);
        }

        function restartGame() {
          startGame();
        }

        playBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);

        lanes.addEventListener('pointerdown', (event) => {
          const laneEl = event.target.closest('.lane');
          if (!laneEl) return;
          hitLane(Number(laneEl.dataset.index));
        }, { passive: true });

        window.addEventListener('keydown', (event) => {
          if (event.code === 'Space' || event.code === 'Enter') {
            event.preventDefault();
            hitLane(1);
          }

          if (event.key >= '1' && event.key <= '4') {
            hitLane(Number(event.key) - 1);
          }
        });

        // Ensure song is not playing on load and play UI is visible
        setSong();
        renderLives();
        centerUi.classList.remove('hidden');

        // Pause audio and do not auto-start
        window.addEventListener('load', () => {
          try { song.pause(); } catch (e) {}
          if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
        });

      })();
    </script>
  </body>
</html>
